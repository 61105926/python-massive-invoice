<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga de Facturas - Minoil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

</head>
<body>
    <div class="container">
        <img src="https://www.minoil.com.bo/wp-content/uploads/2019/04/logo-minoil1.png" alt="Minoil Logo" class="logo">
        <h2><i class="fas fa-file-invoice me-2"></i> Descarga de Facturas</h2>
        <form id="upload-form">
            <div class="mb-3">
                <label for="excel" class="form-label"><i class="fas fa-file-excel me-2"></i> Subir archivo Excel</label>
                <input type="file" id="excel" name="excel" accept=".xlsx,.xls" class="form-control">
                <small class="text-muted">El archivo debe contener columnas: CUF, Numero, NIT (opcional), t (opcional)</small>
            </div>
            <button type="submit" id="submit-btn" class="btn-custom">
                <i class="fas fa-download me-2"></i> Iniciar Descarga
            </button>
            <a href="#" id="download-btn" class="btn btn-custom download-btn">
                <i class="fas fa-file-archive me-2"></i> Descargar ZIP
            </a>
        </form>

        <div class="progress-container">
            <h4><i class="fas fa-tasks me-2"></i> Progreso</h4>
            <div class="progress">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
            <p id="progress-text">Esperando archivo Excel...</p>
            
            <div class="log-container">
                <div id="log-entries"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
