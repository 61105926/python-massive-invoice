<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga de Facturas - Minoil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            margin: 20px;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        .logo {
            display: block;
            margin: 0 auto 20px;
            max-width: 200px;
            height: auto;
        }
        h2 {
            font-weight: 700;
            color: #003087;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: 500;
            color: #003087;
        }
        .form-control {
            border: 2px solid #003087;
            border-radius: 10px;
            padding: 12px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-control:hover, .form-control:focus {
            border-color: #0056d2;
            box-shadow: 0 0 10px rgba(0, 86, 210, 0.3);
            outline: none;
        }
        .btn-custom {
            background: #ffcc00;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            color: #003087;
            font-weight: 500;
            font-size: 16px;
            transition: background 0.3s ease, transform 0.2s ease;
            width: 100%;
        }
        .btn-custom:hover {
            background: #e6b800;
            transform: translateY(-2px);
        }
        .btn-custom:disabled {
            background: #cccccc;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }
        .progress-container {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            transition: background 0.3s ease;
        }
        .progress-container.active {
            background: #fff3e6;
        }
        .progress-container.success {
            background: #e6ffe6;
        }
        .progress-container.error {
            background: #ffe6e6;
        }
        .progress {
            height: 15px;
            border-radius: 10px;
            background: #dfe6e9;
            overflow: hidden;
        }
        .progress-bar {
            background: #003087;
            transition: width 0.5s ease;
        }
        #progress-text {
            font-weight: 500;
            color: #003087;
            margin-top: 10px;
        }
        .log-container {
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #ddd;
        }
        .log-entry {
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }
        .log-entry.error {
            color: #dc3545;
        }
        .log-entry.success {
            color: #28a745;
        }
        .log-entry.warning {
            color: #ffc107;
        }
        .download-btn {
            display: none;
            margin-top: 20px;
            background: #28a745;
            color: white;
        }
        .download-btn:hover {
            background: #218838;
            color: white;
        }
        .spinner-border {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.minoil.com.bo/wp-content/uploads/2019/04/logo-minoil1.png" alt="Minoil Logo" class="logo">
        <h2><i class="fas fa-file-invoice me-2"></i> Descarga de Facturas</h2>
        <form id="upload-form">
            <div class="mb-3">
                <label for="excel" class="form-label"><i class="fas fa-file-excel me-2"></i> Subir archivo Excel</label>
                <input type="file" id="excel" name="excel" accept=".xlsx,.xls" class="form-control">
                <small class="text-muted">El archivo debe contener columnas: CUF, Numero, NIT (opcional), t (opcional)</small>
            </div>
            <button type="submit" id="submit-btn" class="btn-custom">
                <i class="fas fa-download me-2"></i> Iniciar Descarga
            </button>
            <a href="#" id="download-btn" class="btn btn-custom download-btn">
                <i class="fas fa-file-archive me-2"></i> Descargar ZIP
            </a>
        </form>

        <div class="progress-container">
            <h4><i class="fas fa-tasks me-2"></i> Progreso</h4>
            <div class="progress">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
            <p id="progress-text">Esperando archivo Excel...</p>
            
            <div class="log-container">
                <div id="log-entries"></div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Connect to Socket.IO server with explicit URL
            const socketUrl = window.location.protocol + '//' + window.location.hostname + ':' + window.location.port;
            const socket = io.connect(socketUrl);
            
            let isProcessing = false;
            const logEntries = [];
            const maxLogEntries = 50;
            
            // Add log entry function
            function addLogEntry(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const entry = `<div class="log-entry ${type}">[${timestamp}] ${message}</div>`;
                
                logEntries.push(entry);
                if (logEntries.length > maxLogEntries) {
                    logEntries.shift();
                }
                
                $("#log-entries").html(logEntries.join(''));
                $(".log-container").scrollTop($(".log-container")[0].scrollHeight);
            }
            
            // Socket.IO connection events
            socket.on('connect', function() {
                addLogEntry('Conectado al servidor', 'success');
                console.log('Socket.IO connected');
            });
            
            socket.on('disconnect', function() {
                addLogEntry('Desconectado del servidor', 'error');
                console.log('Socket.IO disconnected');
            });
            
            socket.on('connect_error', function(error) {
                addLogEntry('Error de conexión: ' + error, 'error');
                console.error('Socket.IO connection error:', error);
            });

            // Handle form submission
            $("#upload-form").submit(function(e) {
                e.preventDefault();
                
                if (isProcessing) {
                    alert("Ya hay un proceso en ejecución. Por favor espere.");
                    return;
                }
                
                const excelFile = $("#excel")[0].files[0];
                if (!excelFile) {
                    alert("Por favor, selecciona un archivo Excel.");
                    return;
                }

                // Reset UI
                isProcessing = true;
                $("#submit-btn").prop('disabled', true).html('<span class="spinner-border" role="status" aria-hidden="true"></span> Procesando...');
                $("#progress-bar").css("width", "0%").text("0%").attr("aria-valuenow", 0);
                $("#progress-text").text("Iniciando proceso...");
                $(".progress-container").removeClass("success error").addClass("active");
                $("#download-btn").hide();
                logEntries.length = 0;
                $("#log-entries").empty();
                
                addLogEntry('Subiendo archivo Excel...', 'info');

                const formData = new FormData();
                formData.append("excel", excelFile);

                $.ajax({
                    url: "/upload",
                    type: "POST",
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(response) {
                        addLogEntry('Archivo subido correctamente. Iniciando descarga de facturas...', 'success');
                    },
                    error: function(xhr) {
                        isProcessing = false;
                        $("#submit-btn").prop('disabled', false).html('<i class="fas fa-download me-2"></i> Iniciar Descarga');
                        $(".progress-container").removeClass("active").addClass("error");
                        
                        const errorMsg = xhr.responseText || "Error desconocido al iniciar la descarga.";
                        $("#progress-text").text("Error: " + errorMsg);
                        addLogEntry('Error: ' + errorMsg, 'error');
                    }
                });
            });

            // Handle progress updates
            socket.on("progress_update", function(data) {
                console.log("Progress update:", data);
                
                if (data.error) {
                    addLogEntry(data.error, 'error');
                }
                
                if (data.message) {
                    addLogEntry(data.message);
                }
                
                if (data.total > 0) {
                    const progressPercent = (data.current / data.total) * 100;
                    $("#progress-bar").css("width", progressPercent + "%")
                                     .text(progressPercent.toFixed(0) + "%")
                                     .attr("aria-valuenow", progressPercent);
                    
                    if (data.message) {
                        $("#progress-text").text(data.message);
                    } else {
                        $("#progress-text").text(`Procesando: ${data.current}/${data.total} (${progressPercent.toFixed(0)}%)`);
                    }
                }
                
                // Check if download is complete or available
                if (data.download_url) {
                    isProcessing = false;
                    $("#submit-btn").prop('disabled', false).html('<i class="fas fa-download me-2"></i> Iniciar Descarga');
                    
                    // Even if there were errors, if we have a download URL, consider it a partial success
                    $(".progress-container").removeClass("active error").addClass("success");
                    
                    // Show download button
                    $("#download-btn").show().attr("href", data.download_url);
                    
                    // If we have both errors and downloads, it's a partial success
                    if (data.error) {
                        addLogEntry('Proceso completado con algunos errores. El archivo ZIP contiene las facturas que se pudieron descargar.', 'warning');
                    } else {
                        addLogEntry('Proceso completado. El archivo ZIP está listo para descargar.', 'success');
                    }
                }
                
                // If process is complete without a download URL
                if (data.current === data.total && data.total > 0 && !data.download_url) {
                    isProcessing = false;
                    $("#submit-btn").prop('disabled', false).html('<i class="fas fa-download me-2"></i> Iniciar Descarga');
                    
                    if (data.error) {
                        $(".progress-container").removeClass("active").addClass("error");
                    } else {
                        $(".progress-container").removeClass("active").addClass("success");
                    }
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
